# Nginx site config for the portfolio: serves the Flutter web build as static
# files, and reverse-proxies /api and /uploads to the Node backend (PM2,
# listening on 127.0.0.1:3000). One origin, one TLS cert (apex + www).
#
# Install: copy to /etc/nginx/sites-available/portfolio, symlink into
# sites-enabled, then run `certbot --nginx -d yourdomain.com -d www.yourdomain.com`
# (certbot rewrites this file in place to add the TLS server block — see DEPLOY.md).
#
# Replace every occurrence of yourdomain.com below with your real domain.

server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/portfolio/frontend;
    index index.html;

    # Flutter web build: serve static assets directly, fall back to
    # index.html for client-side (go_router) routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache immutable build assets aggressively; index.html itself is not
    # cached so deploys are picked up immediately.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Node API.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m; # allow resume/image uploads through
    }

    # Uploaded images/resume — served directly by Nginx from disk for
    # performance (bypasses Node). Must match backend/uploads on the server.
    location /uploads/ {
        alias /var/www/portfolio/backend/uploads/;
        add_header Cache-Control "public, max-age=86400";
    }
}
