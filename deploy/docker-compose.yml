# Local development only. Spins up a MySQL instance matching what the VPS runs in prod.
# Usage: docker compose -f deploy/docker-compose.yml up -d
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      # Host port 3307 (not 3306) to avoid clashing with a local MySQL install/service.
      - "3307:3306"
    volumes:
      - portfolio_mysql_data:/var/lib/mysql

volumes:
  portfolio_mysql_data:
